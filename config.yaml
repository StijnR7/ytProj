# ============================================================
#  Probe Into It - video factory settings
#  Edit freely. Paths are relative to this folder.
# ============================================================

channel:
  name: "Probe Into It"
  handle: "@ProbeIntoIt"
  tagline: "Every rabbit hole, fully explored."
  mascot_name: "Zib"
  # Topic pillars the idea generator rotates through.
  categories: [history, space, animals, hypotheticals]
  # Appended to every description.
  description_footer: |
    Narrated by Zib, the tiny probe that pokes into every rabbit hole.
    New deep dives every week - subscribe so Zib can find you.

claude:
  command: claude          # the Claude Code CLI (uses your Claude subscription)
  model: ""                # "", "opus" or "sonnet". Empty = CLI default
  web_research: true       # let Claude use web search during the research stage
  timeout_minutes: 20

script:
  target_words: 2300       # asked of Claude; first drafts tend to come in short, final scripts land ~1900-2300 (11-14 min)
  min_words: 1750
  min_video_minutes: 10
  hook_doctor: true        # extra Claude pass that rewrites the first 30s for a harder hook

voice:
  engine: kokoro           # kokoro (local, free) | edge (free online MS voices) | dummy (testing)
  kokoro_voice: am_michael # try: python -m ytfactory voices
  speed: 1.05             # slightly brisk = better retention
  edge_voice: en-US-AndrewNeural
  pause_after_scene: 0.15  # seconds of silence between paragraphs (keep it tight - dead air loses viewers)
  pause_after_chapter: 0.4

stock:
  # Real footage + photos are the main visuals. Free API keys (2 minutes each, no credit card):
  #   Pexels:  https://www.pexels.com/api/       Pixabay: https://pixabay.com/api/docs/
  # Paste them below or run: python -m ytfactory keys
  pexels_key: ""
  pixabay_key: ""
  video: true              # use stock video clips (much more movement than stills)
  openverse: true          # keyless: Creative Commons photos (Flickr, museums, ...)
  nasa: true               # keyless: NASA image library (space videos!)
  vision_pick: true        # Claude looks at the options and picks the one that really matches the narration
  candidates: 6            # options shown to Claude per shot

images:
  # AI images are only used where no real photo/footage exists (hypotheticals, prehistory, ...)
  backend: sdcpp           # sdcpp (stable-diffusion.cpp, Vulkan = AMD friendly) | comfyui | none
  max_ai_images: 25        # cap per video; beyond this, shots reuse earlier images as closeups
  width: 1344
  height: 768
  style: >-
    cinematic digital painting, documentary concept art, realistic proportions, dramatic natural lighting,
    rich color, sharp focus, highly detailed, no text
  negative: >-
    text, letters, words, watermark, signature, logo, blurry, lowres, jpeg artifacts,
    deformed, extra limbs, cartoon, childish
  sdcpp:
    exe: tools/sd/sd.exe          # auto-detected by setup (sd.exe or sd-cli.exe)
    preset: flux_schnell          # flux_schnell (best quality, recommended) | sdxl
    flux:
      diffusion_model: models/flux/flux1-schnell-q4_0.gguf
      vae: models/flux/ae.safetensors
      clip_l: models/flux/clip_l.safetensors
      t5xxl: models/flux/t5xxl_fp16.safetensors
      steps: 4
    # sdxl preset
    model: models/sd_xl_base_1.0.safetensors
    vae: models/sdxl_vae_fp16_fix.safetensors
    lora_dir: models/lora
    lora: sdxl_lightning_8step_lora
    steps: 8
    cfg: 1.0
    sampler: euler
    extra_args: ["--vae-tiling"]
  comfyui:
    url: http://127.0.0.1:8188
    checkpoint: sd_xl_base_1.0.safetensors
    steps: 25
    cfg: 6.0
    sampler: dpmpp_2m
    scheduler: karras
  wikimedia: true          # Wikimedia Commons for archive shots (kings, paintings, maps, artifacts)

video:
  width: 1920
  height: 1080
  fps: 30
  crf: 20
  preset: veryfast
  workers: 0               # 0 = auto (half your CPU threads)
  burn_captions: false     # captions are always exported as .srt for upload
  max_still_seconds: 2.5   # hard rule: nothing on screen may stay still longer than this (scenes are re-rendered with extra motion)

music:
  folder: assets/music     # drop royalty-free tracks here (e.g. YouTube Audio Library). Empty = Zib composes ambient music
  volume_db: -20
